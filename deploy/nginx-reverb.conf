# Reverse proxy Reverb di path /app pada domain utama.
# Sisipkan blok ini ke dalam server { } vhost yang sudah ada di aaPanel,
# DI ATAS location / dan di atas baris include enable-php-*.conf.

location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Koneksi WebSocket berumur panjang, jangan diputus timeout default
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Endpoint HTTP API Reverb (dipakai Laravel untuk publish event).
# Hanya diperlukan bila publish dilakukan dari host lain; untuk satu VPS
# Laravel menembak 127.0.0.1:8080 langsung sehingga blok ini bisa dilewati.
location /apps {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Batasi ke jaringan internal bila diaktifkan
    allow 127.0.0.1;
    deny all;
}
